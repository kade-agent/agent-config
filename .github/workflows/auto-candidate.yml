# Auto-candidate (docs/release-flow-plan.md, section 4a). Once test has passed on a push to main,
# this workflow pushes candidate/<12-character sha> at that commit when main has a file deployed to
# ~/.claude that the latest release has not (scripts/release.cjs should-candidate), so no agent has
# to push it by hand. Kade still starts Candidate and Promote.
#   - Only the newest main is a candidate: a run whose commit is no longer main's head does nothing,
#     and an unused candidate branch at an older commit is deleted first (Kade, 2026-10-23).
#   - While Candidate is running or queued it pushes nothing and fails, so the branch Candidate
#     reads is never deleted under it; an agent pushes the branch by hand afterwards.
#   - It fails only when it could not push; that is when Kade asks an agent to push by hand.
# The branch is created with GITHUB_TOKEN, which starts no workflow, so the guard does not run on
# it; Candidate checks the name, main, the head and the checks again. Only the push job can write,
# and it checks nothing out.
name: Auto-candidate

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: auto-candidate
  cancel-in-progress: false

jobs:
  decide:
    name: decide on a candidate
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      push: ${{ steps.decide.outputs.push }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployed files changed since the latest release
        id: decide
        run: |
          set -euo pipefail
          files=$(node scripts/release.cjs should-candidate)
          if [ -z "$files" ]; then
            echo "Nothing deployed to ~/.claude changed since the latest release: no candidate." >> "$GITHUB_STEP_SUMMARY"
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            { echo "Deployed files changed since the latest release:"; echo; echo "$files" | sed 's/^/- `/; s/$/`/'; } >> "$GITHUB_STEP_SUMMARY"
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

  push:
    name: push the candidate branch
    needs: decide
    if: needs.decide.outputs.push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # creating the candidate branch, deleting an unused one
      actions: read    # whether Candidate is running
    steps:
      - name: Push candidate/<sha> at main, replacing an unused candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          branch="candidate/${SHA:0:12}"
          main=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$main" != "$SHA" ]; then
            echo "main has moved on to $main; its own test run decides on a candidate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          running=$(gh api "repos/$REPO/actions/workflows/candidate.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$running" != 0 ]; then
            echo "::error::Candidate is running; once it has finished, push $branch by hand (release-flow, step 2)"
            exit 1
          fi
          exists=false
          for ref in $(gh api "repos/$REPO/git/matching-refs/heads/candidate/" --jq '.[].ref'); do
            old=${ref#refs/heads/}
            if [ "$old" = "$branch" ]; then exists=true; continue; fi
            gh api -X DELETE "repos/$REPO/git/refs/heads/$old" > /dev/null
            echo "Deleted the unused $old." >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$exists" = false ]; then
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$SHA" > /dev/null
          fi
          echo "Ready: Actions > Candidate > Run workflow > branch \`$branch\`." >> "$GITHUB_STEP_SUMMARY"
